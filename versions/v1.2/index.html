<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ça roule</title>
<meta name="theme-color" content="#312E81">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="../../icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../../icons/favicon-32.png">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Ça roule">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d2433;--muted:#667085;--line:#e4e1d8;--accent:#2f5bea;--ok:#1a8a4a;--okbg:#e7f6ee;--bad:#c93c3c;--badbg:#fdeceb;--warn:#a1650f;--warnbg:#fdf3e1;--r:14px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.logo{font-weight:800;font-size:24px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.logo span{color:var(--accent)}
.logo svg{width:30px;height:30px;flex:none}
button{font:inherit;cursor:pointer}
.btn-link{background:none;border:0;color:var(--accent);font-weight:600;padding:6px 8px;border-radius:8px}
.btn-link:hover{background:rgba(47,91,234,.08)}
.btn-link.sm{font-size:14px;padding:4px 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:600;color:var(--ink)}
.chip.on{border-color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 13%,#fff)}
.links{margin-top:8px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.mode{border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px;text-align:left;color:var(--ink)}
.mode b{display:block;font-size:17px}
.mode small{color:var(--muted);font-size:14px}
.mode.on{border-color:var(--accent);background:#eef2fe}
.opt-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0;flex-wrap:wrap}
.seg{display:flex;border:2px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:#fff;padding:7px 14px;font-weight:600}
.seg button.on{background:var(--accent);color:#fff}
.count-in{width:5.5em;border:2px solid var(--line);border-radius:10px;padding:6px 8px;font:inherit;font-weight:600}
.count-in.on{border-color:var(--accent);background:#eef2fe}
.switch{position:relative;width:48px;height:28px;border-radius:99px;border:0;background:#cfd4dc;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.switch.on{background:var(--accent)}
.switch.on::after{left:23px}
.primary{display:block;width:100%;border:0;background:var(--accent);color:#fff;font-weight:700;font-size:18px;padding:14px;border-radius:12px}
.primary:hover{filter:brightness(1.07)}
.primary:disabled{opacity:.5;cursor:default}
.err{color:var(--bad);font-weight:600;text-align:center;min-height:1.5em}
.qtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-weight:700}
.bar{height:8px;background:#e6e3da;border-radius:99px;overflow:hidden;margin-bottom:14px}
.bar div{height:100%;background:var(--accent);transition:width .3s}
.tag{display:inline-block;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
.instr{font-weight:700;margin:0 0 14px;font-size:18px}
.sentence{font-size:22px;line-height:1.9;margin:6px 0 14px}
.sentence input.tin{font:inherit;font-size:20px;border:0;border-bottom:3px solid var(--accent);background:#f1f4fe;padding:2px 6px;border-radius:6px 6px 0 0;min-width:6ch;max-width:100%;color:var(--ink)}
.sentence input.tin:focus{outline:none;background:#e6ecfd}
.blank{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--accent);background:#f1f4fe;border-radius:6px 6px 0 0;text-align:center;color:var(--muted)}
.hint{color:var(--muted);font-size:18px;white-space:nowrap}
.tt{display:inline-block;font-size:14px;font-weight:700;padding:2px 10px;border-radius:99px;background:color-mix(in srgb,var(--c) 14%,#fff);color:color-mix(in srgb,var(--c) 80%,#000);border:1px solid color-mix(in srgb,var(--c) 35%,#fff)}
.src{font-size:21px;background:#f7f6f2;border-left:4px solid var(--line);padding:10px 14px;border-radius:8px;margin-bottom:10px}
.sig{margin:0 0 12px;color:var(--muted)}
.sig b{color:var(--ink)}
textarea.full{width:100%;font:inherit;font-size:20px;border:2px solid var(--line);border-radius:10px;padding:10px 12px;resize:none;min-height:3.2em}
textarea.full:focus{outline:none;border-color:var(--accent)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:14px 10px;font-weight:700;color:var(--ink)}
.opts button:hover:not(:disabled){border-color:var(--accent)}
.opts button.right{border-color:var(--ok);background:var(--okbg)}
.opts button.wrong{border-color:var(--bad);background:var(--badbg)}
.opts button:disabled{cursor:default}
.opts.two button{font-size:22px;padding:18px 10px}
mark{background:#fff0a8;padding:0 3px;border-radius:4px}
.fb{border-radius:12px;padding:14px 16px;margin-top:14px;font-size:16px}
.fb.ok{background:var(--okbg)}.fb.bad{background:var(--badbg)}.fb.warn{background:var(--warnbg)}
.fbt{font-weight:800;font-size:18px;margin-bottom:4px}
.fb.ok .fbt{color:var(--ok)}.fb.bad .fbt{color:var(--bad)}.fb.warn .fbt{color:var(--warn)}
.sol{font-size:18px;margin:6px 0}
.rule{margin-top:8px}
.tip{margin-top:8px;font-weight:600}
.actions{margin-top:16px}
.big{font-size:56px;font-weight:800;text-align:center;line-height:1.1}
.big small{display:block;font-size:17px;color:var(--muted);font-weight:600}
.stat{display:grid;grid-template-columns:170px 1fr 48px;gap:10px;align-items:center;margin:8px 0;font-size:15px}
.stat .track{height:10px;background:#eee;border-radius:99px;overflow:hidden}
.stat .track div{height:100%}
.mist{border-top:1px solid var(--line);padding:10px 0;font-size:16px}
.mist .you{color:var(--bad)}
.btns{display:grid;gap:10px}
.secondary{width:100%;border:2px solid var(--accent);background:#fff;color:var(--accent);font-weight:700;font-size:17px;padding:12px;border-radius:12px}
.modal{position:fixed;inset:0;background:rgba(20,24,35,.45);display:flex;align-items:flex-start;justify-content:center;padding:20px 12px;overflow:auto;z-index:10}
.modal.hidden{display:none}
.modal .card{max-width:720px;width:100%}
.rt{border-top:1px solid var(--line);padding:12px 0;font-size:15px}
.rt p{margin:4px 0}
.hdr-r{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fs{border:2px solid var(--line);background:#fff;border-radius:10px;padding:4px 10px;font-weight:800;color:var(--ink);min-width:44px}
.fs:hover{border-color:var(--accent)}
.fs:disabled{opacity:.35;cursor:default}
.name{display:block;width:100%;font:inherit;font-size:22px;font-weight:700;text-align:center;border:0;border-bottom:2px dashed var(--line);padding:6px;margin-bottom:12px;color:var(--ink)}
.name:focus{outline:none;border-bottom-color:var(--accent)}
.center{text-align:center}.muted{color:var(--muted)}
.shot{text-align:center;background:#f1f4fe;border-radius:10px;padding:8px 10px;margin:12px 0 0;font-weight:600}
details.all summary{cursor:pointer;font-weight:700;padding:2px 0}
details.all[open] summary{margin-bottom:8px}
.mist.r-bad{background:var(--badbg);border-radius:8px;padding:10px;margin:6px 0;border:0}
.mist.r-ok{border-top:1px solid var(--line)}
.okc{color:var(--ok);font-weight:600}
.info{background:#f7f6f2;border-radius:10px;padding:12px 14px;margin:10px 0 4px;font-size:15px}
.info p{margin:4px 0}
footer{text-align:center;color:var(--muted);font-size:13px;margin-top:24px}
.lang{border-width:2px}.lang button{padding:4px 10px;font-size:14px;font-weight:800}
/* Akzent-Knöpfe */
.acc{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.acc button{border:2px solid var(--line);background:#fff;border-radius:10px;min-width:42px;padding:6px 8px;font-size:19px;font-weight:700;color:var(--ink)}
.acc button:hover{border-color:var(--accent);background:#eef2fe}
.acc small{width:100%;color:var(--muted);font-size:13px}
/* Tabelle */
.ctab{display:grid;grid-template-columns:110px 1fr;gap:8px 10px;align-items:center;margin:6px 0 4px}
.ctab label{font-weight:700;color:var(--muted);text-align:right}
.ctab input{font:inherit;font-size:19px;border:2px solid var(--line);border-radius:10px;padding:7px 10px;min-width:0;width:100%;color:var(--ink)}
.ctab input:focus{outline:none;border-color:var(--accent)}
.ctab input.rok{border-color:var(--ok);background:var(--okbg)}
.ctab input.rbad{border-color:var(--bad);background:var(--badbg)}
.trow{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;padding:3px 0;font-size:16px}
.trow span:first-child{color:var(--muted);text-align:right}
/* Verbliste */
.vtools{position:sticky;top:-20px;background:#fff;padding:4px 0 10px;z-index:2;border-bottom:1px solid var(--line);margin-bottom:6px}
.vsearch{width:100%;font:inherit;font-size:17px;border:2px solid var(--line);border-radius:10px;padding:9px 12px;margin:8px 0}
.vsearch:focus{outline:none;border-color:var(--accent)}
.vrow2{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.vseg button{padding:5px 12px;font-size:14px}
.vcount{color:var(--muted);font-size:14px}
.vt{width:100%;border-collapse:collapse;font-size:16px}
.vt th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 8px;border-bottom:2px solid var(--line)}
.vt td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.vt tr.vr{cursor:pointer}
.vt tr.vr:hover td{background:#f1f4fe}
.vt td.b{font-weight:800}
.vt td.de{color:var(--muted);font-size:15px}
.vt td.f{color:#1d3fb3;font-weight:600}
.vtag{display:inline-block;font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:1px;white-space:nowrap;background:#eef0f3;color:#5b6475}
.vtag.e{background:var(--warnbg);color:var(--warn)}
.vr2{border-bottom:1px solid var(--line);padding:9px 6px;cursor:pointer;border-radius:8px}
.vr2:hover{background:#f1f4fe}
.vr2 .vh b{font-size:18px}
.vr2 .vh .muted{font-size:14px;margin-left:4px}
.vr2 .vf{color:#1d3fb3;font-weight:600;margin-top:2px}
.vr2 .vf2{color:#1d3fb3;font-size:15px;margin-top:1px}
.vr2 .lb{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:10px}
.vgrid .rt{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.vt mark{padding:0 1px}
@media (max-width:560px){.vt thead th:nth-child(3){display:none}.vt td.de{font-size:14px}}
@media (max-width:520px){.sentence{font-size:19px}.opts{grid-template-columns:1fr}.opts.two{grid-template-columns:1fr 1fr}.stat{grid-template-columns:120px 1fr 40px}.ctab,.trow{grid-template-columns:84px 1fr}}

/* ---- Arbeitsblatt (Vorschau + Druck) ---- */
.sheetbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.sheetbar button{flex:1;min-width:130px}
.sheetbar .primary{width:auto;font-size:16px;padding:10px 14px}
.secondary{display:block;width:100%;border:2px solid var(--line);background:#fff;color:var(--ink);font-weight:700;font-size:16px;padding:12px;border-radius:12px}
.sheetbar .secondary{width:auto;padding:10px 14px}
.sheet{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px 26px;margin-bottom:16px;color:#111;font-size:15px;line-height:1.45}
.sheet h1{font-size:1.3em;margin:0 0 2px}
.sheet .sub{color:#555;font-size:.9em;margin:0 0 10px}
.sheet .meta{display:flex;gap:24px;margin:10px 0 16px}
.sheet .meta span{flex:1;border-bottom:1px solid #333;padding-bottom:2px;font-size:.9em;color:#444}
.sheet .t{break-inside:avoid;margin:0 0 14px}
.sheet .t .n{font-weight:700;margin-right:6px}
.sheet .t .ins{font-size:.82em;color:#555;margin-bottom:2px}
.sheet .blank{display:inline-block;border-bottom:1.5px solid #222;height:1.05em;vertical-align:baseline}
.sheet .wl{border-bottom:1px solid #999;height:1.9em}
.sheet .opt{display:inline-block;margin-right:14px;white-space:nowrap}
.sheet .box{display:inline-block;width:.8em;height:.8em;border:1.5px solid #222;border-radius:2px;margin-right:4px;vertical-align:-1px}
.sheet .hint{color:#555}
.sheet .tg{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 24px;margin-top:4px}
.sheet .tg div{display:flex;gap:6px;align-items:flex-end}
.sheet .tg i{font-style:normal;white-space:nowrap}
.sheet .tg b{flex:1;border-bottom:1px solid #999;height:1.6em}
.sheet .sol-list div{break-inside:avoid;margin:0 0 5px}
@media print{
 @page{size:A4;margin:14mm}
 body{background:#fff;font-size:12pt}
 header,footer,.sheetbar,.modal{display:none!important}
 .wrap{max-width:none;padding:0}
 .sheet{border:0;border-radius:0;padding:0;margin:0;font-size:12pt}
 .sheet.sol{break-before:page}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#312E81"/><path d="M12 14h40a4 4 0 0 1 4 4v22a4 4 0 0 1-4 4H30l-10 9v-9h-8a4 4 0 0 1-4-4V18a4 4 0 0 1 4-4z" fill="#fff"/><text x="32" y="38" font-size="26" font-weight="800" text-anchor="middle" fill="#2f5bea" font-family="Arial,sans-serif">é</text></svg><div>Ça <span>roule</span></div></div>
    <div class="hdr-r">
      <div class="seg lang" id="langSeg" role="group" aria-label="Langue / Sprache"><button data-l="de">DE</button><button data-l="fr">FR</button></div>
      <button class="fs" id="fsMinus" aria-label="A−">A−</button>
      <button class="fs" id="fsPlus" aria-label="A+">A+</button>
      <button class="btn-link" id="rulesBtn">📘 Regeln</button>
      <button class="btn-link" id="verbsBtn">📋 Verben</button>
      <button class="btn-link" id="feedbackBtn" onclick="openAppFeedback()">💬 Feedback</button>
    </div>
  </header>
  <main id="app"></main>
  <footer id="foot">Ça roule</footer>
</div>
<div class="modal hidden" id="modal"><div class="card" id="modalBody"></div></div>

<script>
/* Ça roule v1.2 – französische Zeitformen üben (Oberstufe, A1–B1) */
let LANG='de';try{const l=localStorage.getItem('cr-lang');if(l==='de'||l==='fr')LANG=l}catch(e){}
const L=(de,fr)=>LANG==='fr'?fr:de;
const X=o=>LANG==='fr'?o.fr:o.de;
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
const vowel=w=>/^[aeiouyhàâäéèêëîïôöùûüœ]/i.test(w||'');
const whyT=w=>w.split('|')[LANG==='fr'?1:0]||w;

/* ===== Zeitformen ===== */
const ORDER=['PR','PC','IMP','FC','FS','IMT','CO'];
const T={
 PR:{name:'Présent',c:'#2f5bea',
  use:{de:'Gewohnheiten, Zustände und das, was gerade jetzt passiert',fr:'habitudes, états et ce qui se passe en ce moment'},
  form:{de:'<b>-er-Verben:</b> Stamm + <b>-e, -es, -e, -ons, -ez, -ent</b>. Viele wichtige Verben sind unregelmässig (avoir, être, aller, faire, prendre …)',fr:'<b>verbes en -er :</b> radical + <b>-e, -es, -e, -ons, -ez, -ent</b>. Beaucoup de verbes importants sont irréguliers (avoir, être, aller, faire, prendre …)'},
  ex:'Elle mange une pizza chaque jour.'},
 PC:{name:'Passé composé',c:'#d9480f',
  use:{de:'abgeschlossene Handlung in der Vergangenheit (einmalig, nacheinander)',fr:'action terminée dans le passé (ponctuelle, qui s’enchaîne)'},
  form:{de:'<b>avoir</b> oder <b>être</b> (Présent) + <b>participe passé</b>. Mit <b>être</b>: aller, venir, arriver, partir, sortir, entrer, rentrer, rester, tomber, monter, descendre, devenir und <b>alle reflexiven Verben</b>. Bei être passt sich das Partizip dem Subjekt an (allé, allée, allés, allées)',fr:'<b>avoir</b> ou <b>être</b> (présent) + <b>participe passé</b>. Avec <b>être</b> : aller, venir, arriver, partir, sortir, entrer, rentrer, rester, tomber, monter, descendre, devenir et <b>tous les verbes pronominaux</b>. Avec être, le participe s’accorde avec le sujet (allé, allée, allés, allées)'},
  ex:'Hier, nous avons mangé une pizza. Elle est allée au cinéma.'},
 IMP:{name:'Imparfait',c:'#7b3fe4',
  use:{de:'Gewohnheiten, Beschreibungen und laufende Handlungen in der Vergangenheit',fr:'habitudes, descriptions et actions en cours dans le passé'},
  form:{de:'<b>nous</b>-Form des Présent ohne <b>-ons</b> + <b>-ais, -ais, -ait, -ions, -iez, -aient</b> (nous mangeons → je mangeais). Sonderfall: être → j’<b>ét</b>ais',fr:'forme <b>nous</b> du présent sans <b>-ons</b> + <b>-ais, -ais, -ait, -ions, -iez, -aient</b> (nous mangeons → je mangeais). Cas particulier : être → j’<b>ét</b>ais'},
  ex:'Autrefois, il mangeait une pizza chaque dimanche.'},
 FC:{name:'Futur composé',c:'#0b8f6a',
  use:{de:'nahe, geplante Zukunft («ich werde gleich …»)',fr:'futur proche, projets («je vais …»)'},
  form:{de:'<b>aller</b> (Présent) + <b>Infinitiv</b>: je vais manger, tu vas manger, il va manger …',fr:'<b>aller</b> (présent) + <b>infinitif</b> : je vais manger, tu vas manger, il va manger …'},
  ex:'Demain, je vais manger une pizza.'},
 FS:{name:'Futur simple',c:'#0891b2',
  use:{de:'ferne oder sichere Zukunft, Vorhersagen, Versprechen',fr:'futur lointain ou certain, prédictions, promesses'},
  form:{de:'<b>Infinitiv</b> (bei -re ohne e) + <b>-ai, -as, -a, -ons, -ez, -ont</b>. Unregelmässige Stämme: <b>aur-, ser-, ir-, fer-, viendr-, verr-, pourr-, voudr-, devr-, saur-, enverr-, courr-</b>',fr:'<b>infinitif</b> (sans e pour -re) + <b>-ai, -as, -a, -ons, -ez, -ont</b>. Radicaux irréguliers : <b>aur-, ser-, ir-, fer-, viendr-, verr-, pourr-, voudr-, devr-, saur-, enverr-, courr-</b>'},
  ex:'Un jour, nous habiterons à Paris.'},
 IMT:{name:'Impératif',c:'#c2255c',
  use:{de:'Befehl, Rat, Aufforderung (nur <b>tu, nous, vous</b>, ohne Pronomen)',fr:'ordre, conseil, invitation (seulement <b>tu, nous, vous</b>, sans pronom)'},
  form:{de:'Présent-Form ohne Pronomen. Bei -er-Verben (und aller, ouvrir) hat <b>tu</b> <b>kein -s</b>: Mange ! Reflexiv: Lève-toi ! Verneint: <b>Ne</b> te lève <b>pas</b> !',fr:'forme du présent sans pronom. Pour les verbes en -er (et aller, ouvrir), <b>tu</b> perd son <b>-s</b> : Mange ! Pronominal : Lève-toi ! Négatif : <b>Ne</b> te lève <b>pas</b> !'},
  ex:'Mange une pomme ! Ne mange pas de bonbons !'},

 for(const g of it.vars)for(const p of posList(it)){const P=compose(it,g,p);out.add(P.before+P.gap+P.after)}
 if(it.form==='q'&&it.t!=='IMT'&&it.S.pr&&it.S.k!=='je'&&!it.v.r){
  for(const a of agrs(it.S)){
   const P=parts(it.v,it.t,it.S.p,a);
   const core=P.fin+((it.S.p===2&&/[ae]$/.test(P.fin))?'-t-':'-')+it.S.t+(P.rest?' '+P.rest:'');
   for(const p of posList(it)){const Q=compose(it,core,p,'inv');out.add(Q.before+Q.gap+Q.after)}
  }
 }
 return [...out];
}
function softOf(it){
 const o=Object.assign({},it,{form:'pos'}),out=new Set();
 for(const g of grpVariants(o.v,o.t,false,o.S))for(const p of posList(o)){const P=compose(o,g,p);out.add(P.before+P.gap+P.after)}
 return [...out];
}

/* ===== Prüfen ===== */
function nrm(s){
 s=String(s).toLowerCase().replace(/[’‘`´]/g,"'").replace(/[  ]/g,' ').replace(/-/g,' ').replace(/[.,!?;:«»"“”()…]/g,' ');
 s=s.replace(/[àâä]/g,'a').replace(/[êë]/g,'e').replace(/[îï]/g,'i').replace(/[ôö]/g,'o').replace(/[ùûü]/g,'u').replace(/ç/g,'c').replace(/œ/g,'oe').replace(/æ/g,'ae');
 return s.replace(/\s+/g,' ').trim();
}
const stripAcc=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'');
const eq=(a,b)=>nrm(a)===nrm(b);
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function nearInfo(val,cands){
 const u=nrm(val);let acc=false,near=false;
 for(const c of cands){const n=nrm(c);if(stripAcc(u)===stripAcc(n)){acc=true;near=true}else if(lev(u,n)<=1)near=true}
 return {acc,near};
}

const lvPool=()=>VERBS.filter(v=>v.lv<=(S.lvl==='A'?2:1));
function pool(){
 let p=lvPool();
 if(S.vset==='ae')p=p.filter(v=>v.inf==='avoir'||v.inf==='être');
 else if(S.vset==='etre')p=p.filter(v=>v.aux==='E');
 else if(S.vset==='refl')p=p.filter(v=>v.r);
 return p.length?p:lvPool();
}
function poolFor(t,form){
 let p=pool();
 if(t==='IMT'){
  const f=v=>v.im&&!v.z&&(form==='neg'||!v.n);
  p=p.filter(f);if(!p.length)p=lvPool().filter(f);
 }
 return p;
}
function baseObj(t,form){
 if(t==='IMT'&&form==='q')form='pos';
 const v=rnd(poolFor(t,form));
 if(t==='IMT'&&v.n)form='neg';
 const S0=pickSubj(t);
 return {t,form,S:S0,v,ob:rnd(v.objs),mk:pickMk(t,S0)};
}
function genItem(t,form){return build(baseObj(t,form))}

function genCtx(tn){
 let l=CTX.filter(c=>tn.includes(c.t));if(!l.length)l=CTX;
 const fresh=l.filter(c=>!globalSeen.has('ctx'+CTX.indexOf(c)));
 const c=rnd(fresh.length?fresh:l);
 globalSeen.add('ctx'+CTX.indexOf(c));
 const it=build({t:c.t,form:c.f||'pos',S:SBY[c.s],v:VBY[c.v],ob:OB(c.ob),mk:c.mk});
 it.type='ctx';it.why=c.w;
 if(c.t==='FC'||c.t==='FS'){
  const o2=c.t==='FC'?'FS':'FC';
  for(const g of grpVariants(it.v,o2,it.form==='neg',it.S))if(!it.alt.includes(g))it.alt.push(g);
  it.bothFut=true;
 }
 return it;
}
function pcBase(){
 const v=rnd(arguments.length?arguments[0]:pool());
 const S0=pickSubj('PC');
 return {t:'PC',form:'pos',S:S0,v,ob:rnd(v.objs),mk:pickMk('PC',S0)};
}
function pcSplit(o,mode){
 const a=agrs(o.S)[0],P=parts(o.v,'PC',o.S.p,a);
 const rfTok=P.rf?((['me','te','se'].includes(P.rf)&&vowel(P.fin))?P.rf[0]+"'":P.rf+' '):'';
 const pos=o.mk?(o.mk.p||'post'):null;
 const pre=(o.mk&&pos==='pre')?o.mk.w+(o.mk.sep!==undefined?o.mk.sep:', '):'';
 const post=(o.mk&&pos==='post')?(o.mk.sepPost!==undefined?o.mk.sepPost:' ')+o.mk.w:'';
 const sj=subjLead(o.S,rfTok||P.fin);
 const ob=o.ob.p;
 let before,gap,after,alt=[];
 if(mode==='aux'){before=pre+sj+rfTok;gap=P.fin;after=' '+P.rest+(ob?' '+ob:'')+post+'.'}
 else{
  before=pre+sj+rfTok+P.fin+' ';gap=P.rest;after=(ob?' '+ob:'')+post+'.';
  for(const b of agrs(o.S)){const x=ppAgr(o.v,b);if(x!==gap&&!alt.includes(x))alt.push(x)}
 }
 before=cap(before);
 return {before,gap,after,alt,sentence:before+gap+after};
}

function rowForms(v,t,p){

 const out=[];
 const lst=(p===2)?[['m','s'],['f','s'],['m','p'],['f','p']]:(p===5)?[['m','p'],['f','p']]:(p===0||p===1)?[['m','s'],['f','s']]:[['m','p'],['f','p']];

}

 return {type:'table',t,v,rows,form:'pos',sentence:v.disp+' '+t};
}
function genAns(){

 const v=rnd(poolFor(t,'pos'));

 const q=build({t,form:'q',S:S0,v,ob:rnd(v.objs),mk:null});
 const yes=Math.random()<.5;

 const ob=q.ob;

 for(const g of grpVariants(v,t,!yes,Sa)){
  const sj=subjLead(Sa,g),core=sj+g,obT=yes?ob.p:ob.n;
  for(const pre of [yes?'Oui, ':'Non, ','']){
   answers.push(pre+core+' '+obT);
   answers.push(pre+core);
  }
 }
 const primary=(yes?'Oui, ':'Non, ')+cap(subjLead(Sa,grpVariants(v,t,!yes,Sa)[0])+grpVariants(v,t,!yes,Sa)[0])+' '+(yes?ob.p:ob.n)+'.';
 const prim=(yes?'Oui, ':'Non, ')+subjLead(Sa,grpVariants(v,t,!yes,Sa)[0])+grpVariants(v,t,!yes,Sa)[0]+' '+(yes?ob.p:ob.n)+'.';
 return {type:'ans',t,v,S:S0,Sa,ob,form:yes?'pos':'neg',yes,question:q.sentence,sentence:prim,answers,mk:null};
}
function genTrans(){
 const tn=S.tenses.length?S.tenses:['PR'],nonI=tn.filter(x=>x!=='IMT'),kinds=[];
 if(S.forms.includes('neg'))kinds.push('neg');
 if(S.forms.includes('q')&&nonI.length)kinds.push('q');
 if(nonI.length>=2)kinds.push('tense');
 const kind=kinds.length?rnd(kinds):'neg';
 let src,tgt,o;
 if(kind==='tense'){
  const t1=rnd(nonI);let t2;do{t2=rnd(nonI)}while(t2===t1);
  const form=rnd(S.forms.length?S.forms:['pos']);
  o=baseObj(t1,form);
  src=build(o);
  tgt=build(Object.assign({},o,{t:t2,mk:pickMk(t2,o.S)}));
 }else if(kind==='q'){
  o=baseObj(rnd(nonI),'pos');
  src=build(o);tgt=build(Object.assign({},o,{form:'q'}));
 }else{
  o=baseObj(rnd(tn),'pos');
  if(o.t==='IMT'&&o.v.n)o=baseObj('IMT','neg');
  const pv=poolFor(o.t,'neg');if(!pv.includes(o.v))o.v=rnd(pv);
  src=build(Object.assign({},o,{form:'pos'}));tgt=build(Object.assign({},o,{form:'neg'}));
 }
 const it=Object.assign({},tgt,{type:'trans',instr:kind,src});
 it.vars=variantsOf(tgt);
 it.soft=kind==='q'?softOf(tgt):[];
 it.nomark=(kind==='tense'&&tgt.mk)?variantsOf(build(Object.assign({},tgt,{mk:null}))):[];
 it.showMk=kind==='tense'&&!!tgt.mk;
 it.gv=tgt.vars;
 return it;
}
function checkTrans(it,val){
 if(it.vars.some(a=>eq(val,a)))return 'ok';
 if(it.nomark.some(a=>eq(val,a)))return 'nomark';
 if(it.soft.some(a=>eq(val,a)))return 'soft';
 return 'bad';
}

function makeItem(type){
 const tn=S.tenses.length?S.tenses:['PR'];
 if(type==='trans')return genTrans();
 if(type==='ans')return genAns();
 if(type==='aux')return genAux();
 if(type==='pp')return genPP();
 if(type==='table')return genTable();
 if(type==='ctx')return genCtx(tn);
 const it=genItem(rnd(tn),rnd(S.forms.length?S.forms:['pos']));
 it.type=type;return it;
}
function typeSequence(n){
 const m=S.modes.length?S.modes:['fill'];
 let bag=[];const seq=[];
 for(let i=0;i<n;i++){
  if(!bag.length)bag=m.slice().sort(()=>Math.random()-.5);
  let j=0;
  if(m.length>1&&seq.length>=2&&seq[seq.length-1]===seq[seq.length-2]){j=bag.findIndex(x=>x!==seq[seq.length-1]);if(j<0){bag=m.filter(x=>x!==seq[seq.length-1]).sort(()=>Math.random()-.5);j=0}}
  seq.push(bag.splice(j,1)[0]);
 }
 return seq;
}
function buildRound(n){
 const out=[],types=typeSequence(n);
 for(let i=0;i<n;i++){
  let it,k=0;
  do{it=makeItem(types[i]);k++}while((seen.has(it.type+it.sentence)||globalSeen.has(it.type+it.sentence))&&k<40);
  seen.add(it.type+it.sentence);globalSeen.add(it.type+it.sentence);out.push(it);
 }
 return out;
}

let lastIn=null;

function insertCh(ch){
 const el=(lastIn&&document.body.contains(lastIn)&&!lastIn.disabled)?lastIn:document.querySelector('.tin:not(:disabled)');
 if(!el)return;
 el.focus();
 const s=el.selectionStart==null?el.value.length:el.selectionStart,e2=el.selectionEnd==null?s:el.selectionEnd;
 el.value=el.value.slice(0,s)+ch+el.value.slice(e2);
 el.selectionStart=el.selectionEnd=s+ch.length;
 el.dispatchEvent(new Event('input',{bubbles:true}));
}

function explain(it){

 if(it.why)h+=`<div class="rule"><b>${L('Warum?','Pourquoi ?')}</b> ${esc(whyT(it.why))}</div>`;
 h+=`<div class="rule"><span class="tt" style="--c:${d.c}">${d.name}</span> ${X(d.use)}.<br><b>${L('Bildung','Formation')}:</b> ${X(d.form)}${it.form==='neg'?'<br>'+X(NEG):it.form==='q'?'<br>'+X(QQ):''}</div>`;
 if(it.bothFut)h+=`<div class="rule">${L('<b>Beide Futurformen sind hier möglich.</b> Futur composé = nahe, geplante Zukunft; futur simple = ferne oder sichere Zukunft.','<b>Les deux futurs sont possibles ici.</b> Futur composé = futur proche, prévu ; futur simple = futur lointain ou certain.')}</div>`;
 if(it.mk&&it.mk.w&&MK[it.t].some(m=>m.w===it.mk.w))h+=`<div class="rule"><b>${L('Signalwort','Mot-clé')}:</b> <i>${esc(it.mk.w)}</i> → ${d.name}</div>`;
 return h;
}
function markSent(it){return esc(it.before)+'<mark>'+esc(it.gap)+'</mark>'+esc(it.after)}
function errHint(it,val){
 const u=nrm(val),v=it.v,t=it.t;
 if(it.form==='neg'){
  if(!/(^| )pas( |$)/.test(u))return L('Verneinung: <b>ne … pas</b> steht um das konjugierte Verb (beim passé composé um das Hilfsverb).','Négation : <b>ne … pas</b> entoure le verbe conjugué (au passé composé : l’auxiliaire).');
  if(!/(^| )(ne|n')/.test(u))return L('<b>ne</b> (vor Vokal <b>n’</b>) fehlt.','Il manque <b>ne</b> (devant une voyelle : <b>n’</b>).');
  if(it.ob&&it.ob.p!==it.ob.n&&u.includes(nrm(it.ob.p)))return L('Nach der Verneinung werden <b>un / une / des / du</b> zu <b>de / d’</b>.','Après la négation, <b>un / une / des / du</b> deviennent <b>de / d’</b>.');
 }
 if(t==='PC'&&v){
  const av=/(^|[ '])(ai|as|a|avons|avez|ont)( |$)/.test(u),et=/(^|[ '])(suis|es|est|sommes|etes|sont)( |$)/.test(u);
  if(v.aux==='E'&&av&&!et)return L(`<b>${v.disp}</b> bildet das passé composé mit <b>être</b>.`,`<b>${v.disp}</b> forme le passé composé avec <b>être</b>.`);
  if(v.aux==='A'&&et&&!av)return L(`<b>${v.disp}</b> bildet das passé composé mit <b>avoir</b>.`,`<b>${v.disp}</b> forme le passé composé avec <b>avoir</b>.`);
  if(v.aux==='E')return L('Mit <b>être</b> passt sich das Partizip dem Subjekt an (+e für feminin, +s für Plural).','Avec <b>être</b>, le participe s’accorde avec le sujet (+e au féminin, +s au pluriel).');
  return L(`Partizip: <b>${v.pp}</b>.`,`Participe : <b>${v.pp}</b>.`);
 }
 if(t==='IMP')return L('Imparfait: Stamm der <b>nous</b>-Form + -ais, -ais, -ait, -ions, -iez, -aient.','Imparfait : radical de <b>nous</b> + -ais, -ais, -ait, -ions, -iez, -aient.');
 if(t==='FS')return L('Futur simple: Infinitiv-Stamm + -ai, -as, -a, -ons, -ez, -ont (Sonderstamm: '+v.fut+'-).','Futur simple : radical de l’infinitif + -ai, -as, -a, -ons, -ez, -ont (radical : '+v.fut+'-).');
 if(t==='CO')return L('Conditionnel: Futur-Stamm ('+v.fut+'-) + -ais, -ais, -ait, -ions, -iez, -aient.','Conditionnel : radical du futur ('+v.fut+'-) + -ais, -ais, -ait, -ions, -iez, -aient.');
 if(t==='FC')return L('Futur composé: <b>aller</b> (Présent) + Infinitiv.','Futur composé : <b>aller</b> (présent) + infinitif.');
 if(t==='IMT')return L('Impératif: Présent-Form ohne Pronomen; bei -er-Verben hat <i>tu</i> kein -s.','Impératif : forme du présent sans pronom ; pour les verbes en -er, <i>tu</i> perd son -s.');
 return L('Prüfe die Endung zur Person.','Vérifie la terminaison selon la personne.');
}

 document.querySelectorAll('.opts button').forEach(b=>{b.disabled=true;if(b.dataset.o===it.t)b.classList.add('right');else if(b.dataset.o===k)b.classList.add('wrong')});
 document.getElementById('sent').innerHTML=markSent(it);
 finish(ok,T[k].name,`<div class="fbt">${ok?L('Richtig! 🎉','Correct ! 🎉'):L('Leider falsch.','Dommage, c’est faux.')}</div>${ok?'':L(`Das ist <b>${T[it.t].name}</b>.<br>`,`C’est le <b>${T[it.t].name}</b>.<br>`)}${L('Erkennbar an','On le reconnaît à')}: <mark>${esc(it.gap)}</mark>${explain(it)}`,ok?'ok':'bad');
}
function answerAux(k){
 const it=items[idx],ok=k===it.ans;
 document.querySelectorAll('.opts button').forEach(b=>{b.disabled=true;if(b.dataset.a===it.ans)b.classList.add('right');else if(b.dataset.a===k)b.classList.add('wrong')});
 document.getElementById('sent').innerHTML=markSent(it)+` <span class="hint">(${esc(hintTxt(it.v))})</span>`;
 const why=it.v.r?L('<b>Reflexive Verben</b> bilden das passé composé immer mit <b>être</b>.','Les <b>verbes pronominaux</b> forment toujours le passé composé avec <b>être</b>.'):it.v.aux==='E'?L(`<b>${esc(it.v.disp)}</b> gehört zu den Verben der Bewegung / Zustandsänderung → <b>être</b> (Partizip passt sich an).`,`<b>${esc(it.v.disp)}</b> est un verbe de mouvement / de changement d’état → <b>être</b> (le participe s’accorde).`):L(`<b>${esc(it.v.disp)}</b> hat keine Sonderregel → <b>avoir</b> (Partizip bleibt unverändert).`,`<b>${esc(it.v.disp)}</b> n’a pas de règle particulière → <b>avoir</b> (le participe reste invariable).`);
 finish(ok,k,`<div class="fbt">${ok?L('Richtig! 🎉','Correct ! 🎉'):L('Leider falsch.','Dommage, c’est faux.')}</div><div class="rule">${why}</div><div class="rule"><span class="tt" style="--c:${T.PC.c}">${T.PC.name}</span> ${X(T.PC.form)}</div>`,ok?'ok':'bad');
}
function checkTable(it){
 const ins=[...document.querySelectorAll('.ctab .tin')];
 if(ins.every(i=>!i.value.trim())){ins[0].focus();return}
 let all=true;const bad=[];
 ins.forEach((inp,i)=>{
  const r=it.rows[i],val=inp.value.trim();
  const ok=!!val&&r.forms.some(f=>eq(val,f));
  inp.classList.add(ok?'rok':'rbad');
  if(!ok){all=false;bad.push(`<div class="trow"><span>${esc(r.lab)}</span><span><s>${esc(val||'—')}</s> → <b>${esc(r.forms[0])}</b>${r.forms.length>1&&it.t==='PC'?` <small class="muted">(${esc(r.forms.slice(1).join(' / '))})</small>`:''}</span></div>`)}
 });
 const user=ins.map(i=>i.value.trim()).join(' · ');
 const tip=all?'':(it.t==='PC'?`<div class="tip">💡 ${errHint({t:'PC',v:it.v,form:'pos'},'')}</div>`:`<div class="tip">💡 ${errHint({t:it.t,v:it.v,form:'pos'},'x')}</div>`);
 finish(all,user,`<div class="fbt">${all?L('Alles richtig! 🎉','Tout est correct ! 🎉'):L('Nicht ganz.','Pas tout à fait.')}</div>${bad.join('')}${tip}${explain(it)}`,all?'ok':'bad');
 it.rowOk=ins.map(i=>i.classList.contains('rok'));
}
function check(){
 const it=items[idx];
 if(it.type==='table')return checkTable(it);
 const inp=document.getElementById('inp'),val=inp.value.trim();
 if(!val){inp.focus();return}
 const fb=document.getElementById('fb');
 let ok=false,nomark=false,soft=false,cands;
 if(it.type==='fill'||it.type==='ctx'||it.type==='pp'){cands=[it.gap,...(it.alt||[])];if(it.type!=='pp')cands.push(it.sentence);ok=cands.some(a=>eq(val,a))}
 else if(it.type==='ans'){cands=it.answers;ok=cands.some(a=>eq(val,a))}
 else{const r=checkTrans(it,val);ok=r==='ok';nomark=r==='nomark';soft=r==='soft';cands=it.vars}
 if(!ok&&tries===0){
  if(nomark){tries=1;fb.innerHTML=`<div class="fb warn"><div class="fbt">${L('Fast!','Presque !')}</div>${L(`Das Signalwort <b>${esc(it.mk.w)}</b> fehlt noch. Noch ein Versuch.`,`Le mot-clé <b>${esc(it.mk.w)}</b> manque encore. Encore un essai.`)}</div>`;inp.focus();return}
  if(soft){tries=1;fb.innerHTML=`<div class="fb warn"><div class="fbt">${L('Fast!','Presque !')}</div>${L('Mach daraus eine Frage mit <b>est-ce que</b> (oder mit Inversion). Noch ein Versuch.','Fais-en une question avec <b>est-ce que</b> (ou avec l’inversion). Encore un essai.')}</div>`;inp.focus();return}
  const ni=nearInfo(val,cands);
  if(ni.near){tries=1;fb.innerHTML=`<div class="fb warn"><div class="fbt">${L('Fast!','Presque !')}</div>${ni.acc?L('Achte auf die Akzente: <b>é</b> und <b>è</b> müssen genau stimmen. Noch ein Versuch.','Attention aux accents : <b>é</b> et <b>è</b> doivent être exacts. Encore un essai.'):L('Prüfe die Schreibweise. Noch ein Versuch.','Vérifie l’orthographe. Encore un essai.')}</div>`;inp.focus();return}
 }
 let sol;
 if(it.type==='fill'||it.type==='ctx'||it.type==='pp')sol=markSent(it)+((it.alt&&it.alt.length)?`<br><small>${L('Auch richtig','Aussi correct')}: <b>${esc(it.alt.join(' / '))}</b></small>`:'');
 else sol='<mark>'+esc(it.sentence)+'</mark>';
 const tip=ok?'':errHint(it,val);
 finish(ok,val,`<div class="fbt">${ok?L('Richtig! 🎉','Correct ! 🎉'):L('Leider falsch.','Dommage, c’est faux.')}</div>
  ${ok?'':`<div>${L('Deine Antwort','Ta réponse')}: <s>${esc(val)}</s></div>`}
  <div class="sol">${ok?(tries?`<small>${L('(im 2. Versuch)','(au 2e essai)')}</small><br>`:''):L('Richtig ist: ','La bonne réponse : ')}${sol}</div>
  ${tip?`<div class="tip">💡 ${tip}</div>`:''}${explain(it)}`,ok?'ok':'bad');
}

 idx<items.length?renderTask():renderResults();
}

function taskText(r){
 const it=r.item,YA=L('Deine Antwort','Ta réponse'),SOL=L('Lösung','Solution');
 const you=`<small>${YA}: <span class="${r.ok?'okc':'you'}">${esc(r.user)}</span></small>`;
 if(it.type==='rec')return `${markSent(it)}<br><small>${L('Deine Wahl','Ton choix')}: <span class="${r.ok?'okc':'you'}">${esc(r.user)}</span>${r.ok?'':` · ${L('Richtig','Correct')}: <b>${T[it.t].name}</b>`}</small>`;
 if(it.type==='aux')return `${markSent(it)}<br><small>${L('Deine Wahl','Ton choix')}: <span class="${r.ok?'okc':'you'}">${esc(r.user)}</span>${r.ok?'':` · ${L('Richtig','Correct')}: <b>${it.ans}</b>`}</small>`;
 if(it.type==='trans')return `<span class="muted">${esc(it.src.sentence)}</span> → ${esc(instrText(it))}<br>${SOL}: <mark>${esc(it.sentence)}</mark><br>${you}`;
 if(it.type==='ans')return `${esc(it.question)} (${it.yes?'Oui':'Non'})<br>${SOL}: <mark>${esc(it.sentence)}</mark><br>${you}`;
 if(it.type==='table')return `<b>${esc(it.v.disp)}</b> · ${T[it.t].name}<br>${it.rows.map(x=>esc(x.lab)+' <b>'+esc(x.forms[0])+'</b>').join(' · ')}<br>${you}`;
 return `${markSent(it)}${it.alt&&it.alt.length?` <small>(${L('auch','aussi')}: ${esc(it.alt.join(' / '))})</small>`:''}<br>${you}`;
}

 </div>

 <details class="card all">
  <summary>${L('📋 Alle Antworten und Lösungen anzeigen','📋 Afficher toutes les réponses et solutions')} <span class="muted">(${n-wrong.length} ✓ · ${wrong.length} ✗)</span></summary>
  ${results.map((r,i)=>`<div class="mist ${r.ok?'r-ok':'r-bad'}"><b>${i+1}. ${r.ok?'✓':'✗'}</b> <span class="tt" style="--c:${T[r.item.t].c}">${T[r.item.t].name}</span> <small class="muted">${TL[r.item.type]}${r.retry?L(' · 2. Versuch',' · 2e essai'):''}</small><br>${taskText(r)}</div>`).join('')}
 </details>
 <div class="btns">
  ${wrong.length?`<button class="primary" id="redo">${L('Fehler nochmal üben','Retravailler les erreurs')}</button>`:''}
  <button class="${wrong.length?'secondary':'primary'}" id="again">${L('Neue Runde','Nouveau tour')}</button>
  <button class="secondary" id="setup">${L('Einstellungen ändern','Modifier les réglages')}</button>
 </div>`;
 document.getElementById('name').oninput=e=>{studentName=e.target.value};
 app.onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.id==='redo')start(shuffle(wrong.map(r=>r.item)));

 };

let vq='',vf='all',vOpen='';
const pcShow=(v,p)=>{const P=parts(v,'PC',p,['m',(p>=3?'p':'s')]),ax=P.rf?P.rf+' ':'';return v.aux==='E'?(strGrp(Object.assign(P,{rest:''}),false)+' '+v.pp+(p>=3?'(e)s':'(e)')):strGrp(P,false)};
function conjCard(v){
 const labs=['je','tu','il/elle/on','nous','vous','ils/elles'];
 const blocks=ORDER.filter(t=>t!=='IMT'||v.im).map(t=>{
  const d=T[t];
  const rows=(t==='IMT'?[1,3,4]:[0,1,2,3,4,5]).map(p=>{
   let f;
   if(t==='IMT')f=impGrp(v,SUBJ.find(s=>s.p===p&&s.pr),false);
   else if(t==='PC')f=pcShow(v,p);
   else f=strGrp(parts(v,t,p,['m','s']),false);
   let lab=t==='IMT'?'':labs[p];if(p===0&&t!=='IMT'&&vowel(f))lab="j'";
   return `<div class="trow"><span>${lab}</span><span><b>${esc(f)}</b></span></div>`;
  }).join('');
  return `<div class="rt"><p><span class="tt" style="--c:${d.c}">${d.name}</span></p>${rows}</div>`;
 }).join('');
 return `<div style="display:flex;justify-content:space-between;align-items:center"><button class="btn-link" id="vback">← ${L('Verbliste','Liste')}</button><button class="btn-link" data-close>✕</button></div>
 <h2 style="margin:6px 0 2px;font-size:20px;text-transform:none;letter-spacing:0;color:var(--ink)">${esc(v.disp)} <small class="muted" style="font-weight:400;font-size:15px">· ${esc(v.de)}</small></h2>
 <p class="muted" style="margin:0 0 4px">${L('Hilfsverb im passé composé','Auxiliaire au passé composé')}: <b>${v.aux==='A'?'avoir':'être'}</b> · participe passé: <b>${esc(v.pp)}</b></p>
 <div class="vgrid">${blocks}</div>`;
}
function vmatch(v,q){if(!q)return true;const n=nrm(q);return [v.inf,v.disp,v.de,v.pp,...v.pr].some(x=>nrm(x).includes(n))}

}
